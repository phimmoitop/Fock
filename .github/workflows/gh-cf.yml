name: GH -> CF

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug'
        required: true
      token:
        description: 'Token'
        required: true
      projectName:
        description: 'projectName'
        required: true
      accountId:
        description: 'AccountID'
        required: true
      acc:
        description: 'G-Acc'
        required: true
      gtoken:
        description: 'G-Token'
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1. Khai báo Cache cho thư mục chứa các file cài đặt (.deb)
      - name: Cache APT Packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-ffmpeg-stable-v1

      # 2. Cài đặt thông minh
      - name: Install ffmpeg (APT mode with Force Cache)
        run: |
          # Ép hệ thống không tự động xóa file sau khi tải
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          
          # Cập nhật danh sách nhưng chạy cực nhanh (-qq)
          sudo apt-get update -qq
          
          # Kiểm tra xem file đã có trong cache chưa, nếu chưa thì tải, có rồi thì cài luôn
          sudo apt-get install -y ffmpeg curl git jq
          
          # Dọn dẹp để đảm bảo cache sạch (tùy chọn)
          sudo apt-get autoclean
          
      - name: Process and Convert to HLS
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          ACC="${{ github.event.inputs.acc }}"
          GTOKEN="${{ github.event.inputs.gtoken }}"
          
          # 1. Clone repo private
          git clone "https://x-access-token:${GTOKEN}@github.com/${ACC}/${SLUG}.git" temp_data
          
          # 2. Tải file m3u8 gốc
          curl -L "https://hit.ssplay.net/hls/${SLUG}.m3u8" -o "input_${SLUG}.m3u8"
          
          # 3. Chuẩn hóa file: Đổi tất cả file segments sang đuôi .html
          # Giữ file trong thư mục hiện tại để ffmpeg dễ tìm
          find temp_data -type f | while read -r file; do
            filename=$(basename "$file")
            name_no_ext="${filename%.*}"
            mv "$file" "./${name_no_ext}.html"
          done

          # 4. Sửa file m3u8 để khớp với các file .html đã đổi tên
          sed -i 's/\.ts/\.html/g' "input_${SLUG}.m3u8"
          sed -i 's/\.png/\.html/g' "input_${SLUG}.m3u8"
          sed -i 's/\.aaa/\.html/g' "input_${SLUG}.m3u8"
          sed -i 's/\.jpg/\.html/g' "input_${SLUG}.m3u8"

          # 5. GỘP BƯỚC: Từ m3u8 (html segments) -> Encode Audio -> Ra HLS mới (.png)
          # -allowed_extensions ALL: Cho phép ffmpeg đọc các file .html như là transport stream
          # -c:v copy: Giữ nguyên video để xử lý nhanh (không tốn CPU)
          # -c:a aac ...: Encode lại audio để sửa lỗi âm thanh không chuẩn
          
          mkdir -p output

          # BƯỚC A: Gộp tất cả segment lẻ thành 1 file MP4 duy nhất và FIX lỗi Timestamp
          # -fflags +genpts: Ép FFmpeg tạo lại mốc thời gian dựa trên m3u8
          ffmpeg -allowed_extensions ALL -fflags +genpts -i "input_${SLUG}.m3u8" \
            -c:v copy \
            -c:a copy \
            -avoid_negative_ts make_zero \
            "temp_full_${SLUG}.mp4"
          
          # BƯỚC B: Từ file MP4 "sạch", cắt ra định dạng fmp4 để upload lên Cloudflare
          # Lúc này đầu vào là 1 file duy nhất nên FFmpeg sẽ chia segment cực kỳ chính xác
          ffmpeg -i "temp_full_${SLUG}.mp4" \
            -c:v copy \
            -c:a copy \
            -start_number 10001 \
            -hls_time 4 \
            -hls_list_size 0 \
            -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "${SLUG}-index.png" \
            -hls_segment_filename "output/${SLUG}-index%d.png" \
            -f hls "output/${SLUG}.m3u8"
          
          # Dọn dẹp
          rm -rf temp_data *.html "input_${SLUG}.m3u8" "temp_full_${SLUG}.mp4"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ github.event.inputs.token }}
          accountId: ${{ github.event.inputs.accountId }}
          projectName: ${{ github.event.inputs.projectName }}
          directory: ./output
          branch: ${{ github.event.inputs.slug }}

            
      - name: Verify Cloudflare deployment (branch domain check)
        id: verify
        continue-on-error: true
        env:
          PROJECT: ${{ github.event.inputs.projectName }}
          BRANCH: ${{ github.event.inputs.slug }}
        run: |
          set -e
          FILE_URL="https://${{ github.event.inputs.slug }}.${{ github.event.inputs.projectName }}.pages.dev/${{ github.event.inputs.slug }}.m3u8"

          echo "[TARGET] $FILE_URL"

          check () {
            code=$(curl -L -o /dev/null -s -w "%{http_code}" "$FILE_URL")
            echo "HTTP CODE: $code"
            [ "$code" = "200" ]
          }

          echo "[WAIT] Waiting 1 minutes for Pages propagation..."
          sleep 60

          echo "[CHECK #1]"
          if check; then
            echo "[SUCCESS] File exists"
            curl -G "https://cp.ssplay.net/cf.php" \
            --data-urlencode "type=ok" \
            --data-urlencode "key=${{ github.event.inputs.projectName }}" \
            --data-urlencode "slug=${{ github.event.inputs.slug }}"
            exit 0
          fi

          echo "[WAIT] Still not found, wait extra 3 minutes..."
          sleep 180

          echo "[CHECK #2]"
          if check; then
            echo "[SUCCESS] File exists after delay"
            exit 0
          fi

          echo "[FAIL] File still missing → mark for redeploy"
          echo "NEED_REDEPLOY=true" >> $GITHUB_ENV
          exit 1

      - name: Deploy to Cloudflare Pages (retry – reuse encoded files)
        if: env.NEED_REDEPLOY == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ github.event.inputs.token }}
          accountId: ${{ github.event.inputs.accountId }}
          projectName: ${{ github.event.inputs.projectName }}
          directory: ./output
          branch: ${{ github.event.inputs.slug }}
