name: GH -> CF

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug'
        required: true
      token:
        description: 'Token'
        required: true
      projectName:
        description: 'projectName'
        required: true
      accountId:
        description: 'AccountID'
        required: true
      acc:
        description: 'G-Acc'
        required: true
      gtoken:
        description: 'G-Token'
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Clone Repo and Prepare Files
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          ACC="${{ github.event.inputs.acc }}"
          GTOKEN="${{ github.event.inputs.gtoken }}"
          
          # 1. Clone repo private
          git clone "https://x-access-token:${GTOKEN}@github.com/${ACC}/${SLUG}.git" temp_data
          
          # 2. Tải file m3u8
          curl -L "https://hit.ssplay.net/hls/${SLUG}.m3u8" -o "${SLUG}.m3u8"
          
          # 3. Chuẩn hóa file: Đổi tất cả file trong repo sang đuôi .html và đưa ra thư mục ngoài
          # Lệnh này tìm tất cả file trong temp_data, lấy tên và đổi đuôi thành .html
          find temp_data -type f | while read -r file; do
            filename=$(basename "$file")
            name_no_ext="${filename%.*}"
            mv "$file" "./${name_no_ext}.html"
          done

          # 4. Kiểm tra và đảm bảo file .m3u8 nội dung khớp với file .html
          # Nếu trong m3u8 là .png hay .ts, ta dùng sed để đổi hàng loạt sang .html
          sed -i 's/\.ts/\.html/g' "${SLUG}.m3u8"
          sed -i 's/\.png/\.html/g' "${SLUG}.m3u8"
          sed -i 's/\.aaa/\.html/g' "${SLUG}.m3u8"
          # (Có thể thêm các đuôi khác nếu cần)

          # 5. Chuyển đổi sang MP4
          # QUAN TRỌNG: Phải có -allowed_extensions ALL nằm TRƯỚC -i
          ffmpeg -allowed_extensions ALL -i "${SLUG}.m3u8" -c copy -bsf:a aac_adtstoasc "${SLUG}.mp4"
          
          # Dọn dẹp
          rm -rf temp_data



      - name: Convert H264 to HLS (.m3u8)
        run: |
          mkdir -p output
          INPUT="${{ github.event.inputs.slug }}.mp4"

          ffmpeg -i "$INPUT" \
            -map 0:v:0 \
            -map 0:a:0 \
            -c:v copy \
            -c:a aac \
            -profile:a aac_low \
            -ar 48000 \
            -ac 2 \
            -b:a 128k \
            -start_number 10001 \
            -hls_time 4 \
            -hls_list_size 0 \
            -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "${{ github.event.inputs.slug }}-index.png" \
            -hls_segment_filename "output/${{ github.event.inputs.slug }}-index%d.png" \
            -f hls "output/${{ github.event.inputs.slug }}.m3u8"


      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ github.event.inputs.token }}
          accountId: ${{ github.event.inputs.accountId }}
          projectName: ${{ github.event.inputs.projectName }}
          directory: ./output
          branch: ${{ github.event.inputs.slug }}

      - name: Callback success
        if: success()
        run: |
          curl -G "https://cp.ssplay.net/cf.php" \
            --data-urlencode "type=ok" \
            --data-urlencode "key=${{ github.event.inputs.projectName }}" \
            --data-urlencode "slug=${{ github.event.inputs.slug }}"

      - name: Callback error
        if: failure()
        run: |
          curl -G "https://cp.ssplay.net/cf.php" \
            --data-urlencode "type=error" \
            --data-urlencode "slug=${{ github.event.inputs.slug }}"
